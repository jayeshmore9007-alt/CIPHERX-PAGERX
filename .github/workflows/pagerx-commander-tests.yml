name: PAGER-X Commander Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/pagerx-android-commander"]

jobs:
  commander-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install backend dependencies
        run: npm install --ignore-scripts
      - name: Run Commander boundary tests
        run: npm test
